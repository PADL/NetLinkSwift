name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - name: Packages
        run: |
          apt-get update
          apt-get install -y pkg-config liburing-dev libnl-3-dev libnl-route-3-dev libnl-nf-3-dev libnl-genl-3-dev libnftnl-dev libmnl-dev
      - name: Checkout
        uses: actions/checkout@v4
      - name: Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
